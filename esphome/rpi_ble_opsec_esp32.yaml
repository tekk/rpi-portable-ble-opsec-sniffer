esphome:
  name: rpi-ble-opsec-esp32
  friendly_name: ESP32 BLE OPSEC Sniffer Node
  includes:
    - oui_classifier.h
    - motion_recorder.h

esp32:
  board: esp32cam
  framework:
    type: arduino

wifi:
  ssid: "YOUR_WIFI_SSID"
  password: "YOUR_WIFI_PASSWORD"

  ap:
    ssid: "ESP32 BLE Sniffer Fallback AP"

logger:
  level: INFO

api:
  encryption:
    key: "GENERATED_ENCRYPTION_KEY"

ota:
  - platform: esphome

web_server:
  port: 80

# 24/7 Promiscuous BLE Tracker & Sniffer
esp32_ble_tracker:
  scan_interval: 300ms
  window: 200ms
  active: true
  on_ble_advertise:
    - lambda: |-
        std::string mac = x.address_str();
        int rssi = x.get_rssi();
        std::string name = x.get_name();
        
        std::string vendor = Esp32BleClassifier::lookup_oui(mac);
        std::string dev_type = Esp32BleClassifier::infer_device_type(mac, name, 0, vendor);
        
        ESP_LOGI("BLE_SNIFFER", "Logged BLE: MAC=%s RSSI=%d Vendor=%s Type=%s", mac.c_str(), rssi, vendor.c_str(), dev_type.c_str());

# Sensors for Home Assistant / Native API
sensor:
  - platform: template
    name: "ESP32 BLE Total Packets Logged"
    id: total_packets_sensor
    accuracy_decimals: 0
    unit_of_measurement: "pkts"

  - platform: template
    name: "ESP32 Motion Sensitivity Score"
    id: motion_score_sensor
    accuracy_decimals: 1

binary_sensor:
  - platform: gpio
    pin: GPIO13
    name: "ESP32 Camera Motion Detected"
    device_class: motion
    id: motion_binary_sensor

# ESP32-CAM Configuration (if using ESP32-CAM module)
esp32_camera:
  name: "ESP32-CAM Motion Camera Feed"
  external_clock:
    pin: GPIO0
    frequency: 20MHz
  i2c_pins:
    sda: GPIO26
    scl: GPIO27
  data_pins: [GPIO5, GPIO18, GPIO19, GPIO21, GPIO36, GPIO39, GPIO34, GPIO35]
  vsync_pin: GPIO25
  href_pin: GPIO23
  pixel_clock_pin: GPIO22
  resolution: 640x480
  jpeg_quality: 10
